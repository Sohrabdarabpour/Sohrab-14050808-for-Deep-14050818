[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sspe"
version = "0.1.0"
description = "SSPE - سامانه مدیریت اسناد و گزارش‌های سازمانی"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask",
    "Flask-WTF",
    "WTForms",
    "Werkzeug",
    "Jinja2",
    "openpyxl",
    "pandas",
    "xlrd",
    "python-dateutil",
    "python-pptx",
    "Pillow",
    "jdatetime",
    "python-dotenv",
    "openai",
    "opencv-python==4.10.0.84",
    "gunicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "isort",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    _archive
  | _backup
  | instance
  | uploads
  | static/uploads
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["_archive/*", "_backup/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["_archive", "_backup", "instance", "uploads", "static/uploads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # طول خط توسط black مدیریت می‌شود
    "B008",  # فراخوانی تابع در مقدار پیش‌فرض آرگومان (الگوی رایج Flask)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # صادرات Blueprintها در __init__ عمدی است
