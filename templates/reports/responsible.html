{% extends "base.html" %}

{% block title %}
گزارش مسئولین
{% endblock %}

{% block body_class %}
page-responsible
{% endblock %}

{% block content %}

<div class="page-header">

    <div class="page-header-content">

        <div class="page-header-title">

            <div class="page-header-icon">
                <i class="fa-solid fa-user-tie"></i>
            </div>

            <div>

                <h1 class="page-title">
                    گزارش عوامل پروژه
                </h1>

                <p class="page-description">
                    لیست عملکرد عوامل پروژه
                </p>

            </div>

        </div>

    </div>

</div>


<div class="responsible-grid">


    <div class="card responsible-card">

        <div class="responsible-card-header">

            <div class="responsible-icon">
                <i class="fa-solid fa-user-check"></i>
            </div>

            <div>

                <h3>
                    عوامل پروژه
                </h3>

                <span>
                    اطلاعات عملکرد عامل
                </span>

            </div>

        </div>


        <div class="responsible-card-body">

            <div class="responsible-item">

                <i class="fa-solid fa-file-lines"></i>

                <span>
                    تعداد اسناد:
                </span>

                <strong>
                    0
                </strong>

            </div>


            <div class="responsible-item">

                <i class="fa-solid fa-clock"></i>

                <span>
                    در انتظار بررسی:
                </span>

                <strong>
                    0
                </strong>

            </div>


        </div>


    </div>



</div>


{% endblock %}
