{% extends "base.html" %}

{% block title %}خطای سرور{% endblock %}

{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/errors/500.css') }}">
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="ep-card">
        <div class="ep-icon">
            <i class="fa-solid fa-server"></i>
        </div>

        <div class="ep-code">500</div>

        <h1 class="ep-title">خطای سرور</h1>

        <p class="ep-text">
            متأسفانه خطایی در سرور رخ داده است.<br>
            لطفاً چند لحظه بعد دوباره تلاش کنید. اگر مشکل ادامه داشت با پشتیبانی تماس بگیرید.
        </p>

        <div class="ep-actions">
            <a href="{{ url_for('main.index') }}" class="ep-btn ep-btn-primary">
                <i class="fa-solid fa-house"></i>
                <span>بازگشت به صفحه اصلی</span>
            </a>
            <a href="javascript:location.reload()" class="ep-btn ep-btn-secondary">
                <i class="fa-solid fa-rotate-right"></i>
                <span>تلاش دوباره</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
